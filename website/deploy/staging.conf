# Only ACME challenges are public until DNS, HTTPS and launch prerequisites are ready.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}
server {
    listen 80;
    server_name example.com;
    server_tokens off;
    access_log /var/log/tomato-focus/acme-access.log;
    error_log /var/log/tomato-focus/error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tomato-focus/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Temporarily unavailable\n";
    }
}
server {
    listen 127.0.0.1:8080;
    server_name example.com;
    include /etc/nginx/tomato-focus/locations.conf;
}
