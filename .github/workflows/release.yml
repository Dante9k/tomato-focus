name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match VERSION $version."
          }
      - name: Build and verify release files
        run: ./scripts/build-website.ps1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --title "朱果 $version" `
            "dist/TomatoFocus-$version-Setup.exe#Windows 图形安装包" `
            "dist/TomatoFocus-$version-Setup.exe.sha256#安装包 SHA-256" `
            "dist/TomatoFocus-$version-win-x64.zip#Windows 便携版" `
            "dist/TomatoFocus-$version-win-x64.zip.sha256#便携版 SHA-256" `
            "dist/TomatoFocus-website-$version.zip#官网离线包" `
            "dist/TomatoFocus-website-$version.zip.sha256#官网离线包 SHA-256"
