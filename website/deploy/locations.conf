root /srv/tomato-focus/current;
index index.html;
charset utf-8;
server_tokens off;
autoindex off;
client_max_body_size 1m;
access_log /var/log/tomato-focus/access.log;
error_log /var/log/tomato-focus/error.log warn;
include /etc/nginx/tomato-focus/security.conf;

# Keep application paths strictly static; do not send a homepage for missing files.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
location / {
    limit_except GET { deny all; }
    try_files $uri $uri/ =404;
}
location ~* \.(?:html|js|css)$ {
    limit_except GET { deny all; }
    expires -1;
    try_files $uri =404;
}
location /downloads/ {
    limit_except GET { deny all; }
    include /etc/nginx/tomato-focus/security.conf;
    add_header Content-Disposition attachment;
    types { application/zip zip; application/octet-stream exe; text/plain txt; }
    default_type application/octet-stream;
    try_files $uri =404;
}
location ~ /\. { deny all; }
