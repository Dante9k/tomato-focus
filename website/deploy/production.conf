server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}
server {
    listen 80;
    server_name example.com;
    server_tokens off;
    access_log /var/log/tomato-focus/acme-access.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tomato-focus/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://example.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name example.com;
    if ($host != example.com) { return 444; }
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tomato_focus_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/tomato-focus/locations.conf;
}
# A local probe never exposes an extra public port.
server {
    listen 127.0.0.1:8080;
    server_name example.com;
    include /etc/nginx/tomato-focus/locations.conf;
}
